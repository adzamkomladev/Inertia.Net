name: hosting-probe

# Process RSS, requests per second, latency and CPU per request of Inertia.Net next to a plain Minimal API serving the same data,
# JIT and Native AOT. Runs when the probe changes, or on demand; the table is in the job summary and the hosting-probe artifact.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - tests/Inertia.Net.HostingProbe/**
      - eng/hosting-probe.sh
      - .github/workflows/hosting-probe.yml

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  hosting-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
          dotnet-version: 10.0.x
      - run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
      - run: nproc && lscpu | grep -E 'Model name|^CPU\(s\)'
      - run: set -o pipefail; mkdir -p artifacts; bash eng/hosting-probe.sh artifacts/hosting-probe.md --seconds 12 --warmup 8 --repeat 5 | tee artifacts/hosting-probe.log
      - run: cat artifacts/hosting-probe.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hosting-probe
          path: artifacts/hosting-probe*
