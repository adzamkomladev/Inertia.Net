name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet build Inertia.Net.slnx -c Release -warnaserror
      - run: dotnet test Inertia.Net.slnx -c Release --no-build
      - name: Pack
        if: matrix.os == 'ubuntu-latest'
        run: dotnet pack Inertia.Net.slnx -c Release --no-build -o artifacts

  # Native AOT publish of tests/Inertia.Net.AotSmoke (any IL2xxx/IL3xxx warning fails), then protocol smoke checks on the binary.
  aot-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
      - run: bash eng/aot-smoke.sh

