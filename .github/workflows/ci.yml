name: ci

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: CI never writes to the repository.
permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      # The SsrNodeProcess tests run a JS fixture under Node.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: dotnet build Inertia.Net.slnx -c Release -warnaserror
      - run: dotnet test --solution Inertia.Net.slnx -c Release --no-build
      - name: Pack
        if: matrix.os == 'ubuntu-latest'
        run: dotnet pack Inertia.Net.slnx -c Release --no-build -warnaserror -o artifacts

  # Native AOT publish of tests/Inertia.Net.AotSmoke (any IL2xxx/IL3xxx warning fails), then protocol smoke checks on the binary.
  aot-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
      - run: bash eng/aot-smoke.sh

  # Playwright E2E: the same spec suite runs against every sample (tests/e2e, contract in samples/README.md).
  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sample: [react, vue, svelte]
        include:
          - sample: react
            dir: MinimalApi.React
            ssr: "1" # also builds the SSR bundle (the sample starts the SSR server itself) and runs the SSR spec
          - sample: vue
            dir: Mvc.Vue
          - sample: svelte
            dir: FastEndpoints.Svelte
    env:
      SAMPLE: ${{ matrix.sample }}
      INERTIA_SSR: ${{ matrix.ssr }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Build the sample frontend
        working-directory: samples/${{ matrix.dir }}
        run: |
          npm ci
          npm run build
      - name: Install Playwright
        working-directory: tests/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run the E2E suite
        working-directory: tests/e2e
        run: npx playwright test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report-${{ matrix.sample }}
          path: |
            tests/e2e/playwright-report
            tests/e2e/test-results
          retention-days: 7

  # dotnet new templates: create an app per framework, build it against the packages of this commit, then build its client.
  templates:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        framework: [react, vue, svelte]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Pack
        run: |
          VERSION=$(sed -n 's|.*<Version>\(.*\)</Version>.*|\1|p' src/Directory.Build.props)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          # The template must reference the version it ships with.
          grep -q "Include=\"Inertia.Net\" Version=\"$VERSION\"" src/Inertia.Net.Templates/content/common/InertiaStarter.csproj
          dotnet pack Inertia.Net.slnx -c Release -warnaserror -o "$RUNNER_TEMP/packages"
      - name: Create the app
        run: |
          dotnet new install "$RUNNER_TEMP/packages/Inertia.Net.Templates.$VERSION.nupkg"
          dotnet new inertia -n Starter -o "$RUNNER_TEMP/Starter" --framework ${{ matrix.framework }}
          cd "$RUNNER_TEMP/Starter"
          dotnet new nugetconfig
          dotnet nuget add source "$RUNNER_TEMP/packages" -n local
      - name: Build the app
        working-directory: ${{ runner.temp }}/Starter
        run: dotnet build -warnaserror
      - name: Build the client
        working-directory: ${{ runner.temp }}/Starter
        run: |
          npm install --no-audit --no-fund
          npm run build
