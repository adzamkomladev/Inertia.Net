name: ci

on:
  push:
    branches: [main]
    paths-ignore:
      # Benchmark apps (built by benchmarks/frameworks/run.sh and their own workflow) and plain notes; docs pages are .mdx.
      - 'benchmarks/**'
      - '**/*.md'
  pull_request:
    paths-ignore:
      # Benchmark apps (built by benchmarks/frameworks/run.sh and their own workflow) and plain notes; docs pages are .mdx.
      - 'benchmarks/**'
      - '**/*.md'

# Read-only token: CI never writes to the repository.
permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
          dotnet-version: 10.0.x # the net10.0 targets run on the .NET 10 runtime
      # The SsrNodeProcess tests run a JS fixture under Node.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: dotnet build Inertia.Net.slnx -c Release -warnaserror
      - run: dotnet test --solution Inertia.Net.slnx -c Release --no-build
      - name: Pack
        if: matrix.os == 'ubuntu-latest'
        run: dotnet pack Inertia.Net.slnx -c Release --no-build -warnaserror -o artifacts

  # Every test project on net10.0 with Redis, MongoDB and PostgreSQL servers (build-test skips those tests: no REDIS_URL / MONGODB_URI / POSTGRES_URL there),
  # measuring line coverage of the libraries. MIN is the 1.9.0 level minus two points, so coverage cannot fall silently.
  data-stores:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:8.2-alpine
        ports: ["6379:6379"]
      mongo:
        image: mongo:8.0
        ports: ["27017:27017"]
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 20
    env:
      REDIS_URL: localhost:6379
      MONGODB_URI: mongodb://localhost:27017
      POSTGRES_URL: Host=localhost;Username=postgres;Password=postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
          dotnet-version: 10.0.x # the net10.0 targets run on the .NET 10 runtime
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22 # managed SSR tests start Node
      - run: dotnet build Inertia.Net.slnx -c Release -warnaserror
      - run: bash eng/coverage.sh
        env:
          MIN: "93.8" # 95.81% at 1.9.0, minus two points

  # Native AOT publish of tests/Inertia.Net.AotSmoke (any IL2xxx/IL3xxx warning fails), then protocol smoke checks on the binary.
  aot-smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tfm: [net10.0, net11.0]
        # The smoke app adds the live backplane whose URL is set, so the native binary connects, subscribes and publishes.
        backplane: [postgres, redis]
    services:
      redis:
        image: redis:8.2-alpine
        ports: ["6379:6379"]
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
          dotnet-version: 10.0.x # the net10.0 targets run on the .NET 10 runtime
      - run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
      - run: bash eng/aot-smoke.sh
        env:
          TFM: ${{ matrix.tfm }}
          POSTGRES_URL: ${{ matrix.backplane == 'postgres' && 'Host=localhost;Username=postgres;Password=postgres' || '' }}
          REDIS_URL: ${{ matrix.backplane == 'redis' && 'localhost:6379' || '' }}

  # Playwright E2E: the same spec suite runs against every sample (tests/e2e, contract in samples/README.md).
  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sample: [react, vue, svelte, react-sse, react-sse-redis, react-sse-postgres, react-signalr-postgres]
        include:
          - sample: react
            dir: MinimalApi.React
            ssr: "1" # also builds the SSR bundle (the sample starts the SSR server itself) and runs the SSR spec
          - sample: vue
            dir: Mvc.Vue
          - sample: svelte
            dir: FastEndpoints.Svelte
          # The live spec again, with live props over Server-Sent Events (Inertia.Net.Live.Sse) instead of SignalR.
          - sample: react-sse
            app: react
            dir: MinimalApi.React
            live: sse
            specs: specs/live.spec.ts
          # Two instances of the React sample on one backplane (live-scale.spec.ts), per transport and store.
          - sample: react-sse-redis
            app: react
            dir: MinimalApi.React
            live: sse
            backplane: redis
            specs: specs/live-scale.spec.ts
          - sample: react-sse-postgres
            app: react
            dir: MinimalApi.React
            live: sse
            backplane: postgres
            specs: specs/live-scale.spec.ts
          - sample: react-signalr-postgres
            app: react
            dir: MinimalApi.React
            backplane: postgres
            specs: specs/live-scale.spec.ts
    services:
      redis:
        image: redis:8.2-alpine
        ports: ["6379:6379"]
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 20
    env:
      SAMPLE: ${{ matrix.app || matrix.sample }}
      INERTIA_SSR: ${{ matrix.ssr }}
      LIVE_TRANSPORT: ${{ matrix.live }}
      VITE_LIVE_TRANSPORT: ${{ matrix.live }}
      LIVE_BACKPLANE: ${{ matrix.backplane }}
      REDIS_URL: localhost:6379
      POSTGRES_URL: Host=localhost;Username=postgres;Password=postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
          dotnet-version: 10.0.x # the net10.0 targets run on the .NET 10 runtime
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Build the sample frontend
        working-directory: samples/${{ matrix.dir }}
        run: |
          npm ci
          npm run build
      # Two instances run the same build (--no-build), so they do not build the project at once.
      - name: Build the sample app
        if: matrix.backplane
        run: dotnet build samples/${{ matrix.dir }} -c Release
      - name: Install Playwright
        working-directory: tests/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run the E2E suite
        working-directory: tests/e2e
        run: npx playwright test ${{ matrix.specs }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report-${{ matrix.sample }}
          path: |
            tests/e2e/playwright-report
            tests/e2e/test-results
          retention-days: 7

  # The documentation app is an Inertia.Net app; build its client so MDX and the search index cannot break.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - name: Build the documentation client and SSR bundle
        working-directory: docs/Inertia.Net.Docs
        run: |
          bun install --frozen-lockfile
          bun run build

  # dotnet new templates: create an app per framework, build it against the packages of this commit, then build its client.
  templates:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        framework: [react, vue, svelte]
        tfm: [net10.0, net11.0]
        auth: [false, true]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
          dotnet-version: 10.0.x # the net10.0 targets run on the .NET 10 runtime
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Pack
        run: |
          VERSION=$(sed -n 's|.*<Version>\(.*\)</Version>.*|\1|p' src/Directory.Build.props)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          # The template must reference the version it ships with.
          grep -q "Include=\"Inertia.Net\" Version=\"$VERSION\"" src/Inertia.Net.Templates/content/common/InertiaStarter.csproj
          dotnet pack Inertia.Net.slnx -c Release -warnaserror -o "$RUNNER_TEMP/packages"
      - name: Create the app
        run: |
          dotnet new install "$RUNNER_TEMP/packages/Inertia.Net.Templates.$VERSION.nupkg"
          dotnet new inertia -n Starter -o "$RUNNER_TEMP/Starter" --framework ${{ matrix.framework }} --tfm ${{ matrix.tfm }} --auth ${{ matrix.auth }}
          cd "$RUNNER_TEMP/Starter"
          dotnet new nugetconfig
          dotnet nuget add source "$RUNNER_TEMP/packages" -n local
      - name: Build the app
        working-directory: ${{ runner.temp }}/Starter
        run: dotnet build -warnaserror
      - name: Generated types and routes are current
        working-directory: ${{ runner.temp }}/Starter
        run: |
          # Rewrites ClientApp/types at build time (the app starts once without listening), then compares with the template's copy.
          dotnet build -warnaserror -p:InertiaGenerateTypesOnBuild=true
          TYPES=src/Inertia.Net.Templates/content/${{ matrix.auth && 'auth/common' || 'common' }}/ClientApp/types
          git diff --no-index --exit-code "$GITHUB_WORKSPACE/$TYPES" ClientApp/types
      - name: Add a page with the item template
        working-directory: ${{ runner.temp }}/Starter
        run: |
          dotnet new inertia-page --component Reports/Monthly --framework ${{ matrix.framework }}
          test -f ReportsMonthlyPage.cs
          # The step the template asks for: register the record in the app's JSON context.
          sed -i 's/^\(\s*\)internal sealed partial class AppJsonContext/\1[JsonSerializable(typeof(ReportsMonthlyPage))]\n&/' Program.cs
          # The page type reaches inertia.d.ts, so the client build below type-checks the new page file.
          dotnet build -warnaserror -p:InertiaGenerateTypesOnBuild=true
          grep -q "'Reports/Monthly'" ClientApp/types/inertia.d.ts
      - name: Build, lint and format-check the client
        working-directory: ${{ runner.temp }}/Starter
        run: |
          npm install --no-audit --no-fund
          npm run build
          npm run lint
          npm run format:check
      - name: Check the published Vite manifest
        if: matrix.framework == 'react' && matrix.tfm == 'net10.0' && !matrix.auth
        working-directory: ${{ runner.temp }}/Starter
        run: |
          dotnet publish -c Release --no-restore -o "$RUNNER_TEMP/published" -warnaserror
          test -f "$RUNNER_TEMP/published/wwwroot/build/.vite/manifest.json"
      - name: Sign-in smoke test
        if: matrix.auth && matrix.tfm == 'net10.0'
        working-directory: tests/e2e
        env:
          STARTER_DIR: ${{ runner.temp }}/Starter
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test -c template/playwright.config.ts
