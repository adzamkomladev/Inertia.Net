name: release

# Push a tag such as v1.0.0 (or v1.1.0-rc.1 for a prerelease) to build, test, pack and publish to NuGet.
on:
  push:
    tags: ['v*']

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

permissions:
  contents: write # create the GitHub Release
  id-token: write # NuGet trusted publishing: exchange the GitHub OIDC token for a short-lived API key

jobs:
  release:
    runs-on: ubuntu-latest
    # Publishing needs approval: add required reviewers to the "release" environment (Settings > Environments), so a pushed
    # tag alone cannot publish. NuGet trusts this repository, workflow and environment (trusted publishing); no stored API key.
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
          dotnet-version: 10.0.x # the net10.0 targets run on the .NET 10 runtime

      # The managed SSR process tests run real node.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Resolve the version from the tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag '$GITHUB_REF_NAME' is not a semantic version (expected vMAJOR.MINOR.PATCH[-prerelease])."
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      # The same -p:Version for build and pack, so the assemblies and the packages agree.
      - run: dotnet build Inertia.Net.slnx -c Release -warnaserror -p:Version=$VERSION
      - run: dotnet test --solution Inertia.Net.slnx -c Release --no-build

      # Only the src projects are packable: Inertia.Net, .EntityFrameworkCore, .Mvc, .FastEndpoints, .Live.SignalR, .Testing and .Templates. They are packed one by one,
      # because packing the solution also warns about every non-packable test project.
      # SourceLink and the snupkg symbol packages come from src/Directory.Build.props.
      - name: Pack
        run: |
          for project in src/*/*.csproj; do
            dotnet pack "$project" -c Release --no-build -p:Version=$VERSION -o artifacts
          done

      - name: Check the package set
        run: |
          ls -l artifacts
          for id in Inertia.Net Inertia.Net.EntityFrameworkCore Inertia.Net.Mvc Inertia.Net.FastEndpoints Inertia.Net.Live.SignalR Inertia.Net.Testing Inertia.Net.Templates; do
            test -f "artifacts/$id.$VERSION.nupkg" || { echo "Missing artifacts/$id.$VERSION.nupkg"; exit 1; }
          done

      # A .snupkg next to a .nupkg is pushed to the symbol server automatically.
      - name: Log in to NuGet
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: adzamkomladev

      - name: Push to NuGet
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Create the GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: artifacts/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
